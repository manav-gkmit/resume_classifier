services:

  embedding-service:
    build: ./embedding_service
    container_name: embedding-service
    ports:
      - "8001:8001"

  inference-service:
    build: ./inference_service
    container_name: inference-service
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EMBED_URL=${EMBED_URL}
    ports:
      - "8000:8000"
    depends_on:
      - embedding-service
    restart: unless-stopped